project_id = "distrihub"

[functions.order-quote-email]
# JWT validated with auth.getUser; authorization is independently checked in SQL.
verify_jwt = false

[functions.saas-checkout]
# The handler authenticates the user's access token with auth.getUser().
verify_jwt = false

[functions.saas-webhook]
# Mercado Pago authenticates each request with HMAC, not a Supabase JWT.
verify_jwt = false

[functions.saas-provider-jobs]
# Scheduled server requests require x-saas-job-secret.
verify_jwt = false

[functions.saas-billing-status]
# Private diagnostic authenticated with the existing scheduler token and server RPC.
verify_jwt = false
