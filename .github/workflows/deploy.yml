name: Implantar DistriHub

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distrihub-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: app/DistriHub.com-main

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/DistriHub.com-main/package-lock.json
            app/DistriHub.com-main/supabase/tests/package-lock.json

      - name: Resolver hostname do certificado FTPS
        id: ftps
        run: node tools/resolveFtpsHost.mjs
        env:
          FTP_SERVER: srv801.hstgr.io
          FTP_TLS_SERVER: ${{ secrets.FTP_TLS_SERVER || 'srv801.hstgr.io' }}

      - name: Validar destino antes de publicar
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_ftps_target.py'
          python3 tools/verify_ftps_target.py
        env:
          FTP_SERVER: ${{ steps.ftps.outputs.server }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - name: Instalar dependências
        run: npm ci

      - name: Instalar dependências dos testes
        run: npm ci --prefix supabase/tests

      - name: Validar TypeScript
        run: npm run typecheck

      - name: Validar lint
        run: npm run lint -- --max-warnings 0

      - name: Executar testes
        run: npm test

      - name: Verificar configuração do Supabase
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "ERRO: VITE_SUPABASE_URL está vazia"
            exit 1
          fi

          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "ERRO: VITE_SUPABASE_ANON_KEY está vazia"
            exit 1
          fi

          echo "OK: variáveis do Supabase foram recebidas"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Gerar build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Publicar na Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftps.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: strict
          port: ${{ secrets.FTP_PORT }}
          local-dir: app/DistriHub.com-main/dist/
          server-dir: ./
          dangerous-clean-slate: false
